name: Compilación FFPatchTweak

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar tweak arm64
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Instalar SDKs de iOS
        run: |
          rm -rf /tmp/theos-sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks

          mkdir -p "$HOME/theos/sdks"

          find /tmp/theos-sdks -maxdepth 1 -type d -name "*.sdk" -exec cp -R {} "$HOME/theos/sdks/" \;

          echo "SDKs instalados:"
          ls -la "$HOME/theos/sdks"

      - name: Verificar proyecto
        run: |
          echo "Contenido del proyecto:"
          ls -la

          echo ""
          echo "Makefile:"
          test -f Makefile

          echo ""
          echo "Ajuste.xm:"
          test -f Ajuste.xm

      - name: Compilar
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1 ARCHS=arm64

      - name: Mostrar paquetes generados
        run: |
          echo "Paquetes:"
          ls -lah packages/

      - name: Subir DEB
        uses: actions/upload-artifact@v4
        with:
          name: FFPatchTweak-arm64
          path: packages/*.deb
          if-no-files-found: error
