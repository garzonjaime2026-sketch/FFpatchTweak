name: Build FFPatchTweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makefile'
      - 'Ajuste.xm'
      - 'FFPatchModule/**'

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Descargar SDKs de Theos
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          find /tmp/theos-sdks -maxdepth 1 -name "*.sdk" -exec cp -R {} "$THEOS/sdks/" \;

      - name: Compilar tweak arm64
        run: |
          make package FINALPACKAGE=1 ARCHS=arm64

      - name: Guardar .deb
        uses: actions/upload-artifact@v4
        with:
          name: FFPatchTweak-arm64
          path: packages/*.deb
          if-no-files-found: error
